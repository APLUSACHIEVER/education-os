<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>APLUS ACHIEVER｜家庭教育管理平台</title>
<style>
:root{
 --bg:#f3f7f5;--surface:#ffffff;--surface2:#f8fbf9;--text:#19332a;--muted:#788780;
 --line:#e4ece8;--green:#23845c;--green-dark:#176545;--green-soft:#e9f5ef;
 --red:#c94b4b;--red-soft:#fff1f1;--amber:#a66a20;--amber-soft:#fff7e9;
 --shadow:0 8px 28px rgba(31,67,52,.06);--radius:18px
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}
button{border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 14px;border-radius:10px;cursor:pointer;transition:.18s ease}
button:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(31,67,52,.08)}
button.primary{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 5px 14px rgba(35,132,92,.18)}
button.primary:hover{background:var(--green-dark)}
header{background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:13px 24px;position:sticky;top:0;z-index:5}
.head{max-width:1240px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:13px;background:linear-gradient(145deg,#2e956b,#176545);color:#fff;display:grid;place-items:center;font-weight:800;font-size:10px;text-align:center;line-height:1.05;box-shadow:0 5px 14px rgba(35,132,92,.2)}
.brand b{display:block;font-size:18px;letter-spacing:.1px}.brand small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
main{max-width:1240px;margin:auto;padding:28px 20px 60px}
.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.top h1{margin:0;font-size:28px;letter-spacing:-.5px}.top p{margin:5px 0 0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat:after{content:"";position:absolute;right:-22px;top:-22px;width:72px;height:72px;border-radius:50%;background:var(--green-soft)}
.stat small{color:var(--muted);position:relative;z-index:1}.stat strong{display:block;font-size:27px;letter-spacing:-.5px;margin-top:5px;position:relative;z-index:1}
.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.8fr);gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:18px;box-shadow:var(--shadow)}
.card h2{font-size:16px;margin:0;font-weight:700}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.section-head button{padding:6px 10px;font-size:13px;background:var(--surface2)}
.schedule{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;overflow:visible;padding:0}
.day{min-width:0;min-height:190px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column}
.day h3{text-align:center;font-size:12px;color:var(--muted);font-weight:600;margin:1px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.day .empty{flex:1;display:flex;align-items:center;justify-content:center;padding:10px}


.event{padding:9px 9px 9px 10px;margin:6px 0;border-radius:10px;background:var(--green-soft);border:1px solid #d7eee3;border-left:4px solid var(--green);cursor:pointer;transition:.16s ease}
.event:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(31,67,52,.07)}
.event b{display:block;font-size:12px;line-height:1.35}.event small{color:var(--muted);font-size:11px;display:block;margin-top:2px}
.event.conflict{background:var(--red-soft);border-color:#f5d7d7;border-left-color:var(--red)}
.row{display:flex;align-items:center;gap:8px}.student{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.student:last-child{border-bottom:0}
.avatar{width:38px;height:38px;border-radius:12px;background:var(--green-soft);display:grid;place-items:center;color:var(--green-dark);font-weight:800}
.student button{font-size:12px;padding:6px 9px;background:var(--surface2)}
.alert{padding:11px 12px;border-radius:11px;margin:7px 0;background:var(--amber-soft);color:var(--amber);border:1px solid #f2dfbd}.alert.red{background:var(--red-soft);color:var(--red);border-color:#f2d5d5}
.money{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.money:last-child{border-bottom:0}.total{font-size:18px;font-weight:800;margin-top:12px;text-align:right}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:9px}.quick button{text-align:left;background:var(--surface2);padding:12px;border-color:var(--line)}.quick b{display:block}.quick span{color:var(--muted);font-size:11px}
.empty{color:#9aa8a1;padding:22px 10px;text-align:center;font-size:13px}
dialog{border:0;border-radius:18px;width:min(460px,92vw);padding:0;color:var(--text);box-shadow:0 22px 70px rgba(0,0,0,.18)}dialog::backdrop{background:rgba(19,35,29,.45);backdrop-filter:blur(2px)}
.modal{padding:22px}.modal h2{margin:0 0 4px;font-size:19px}label{display:block;color:var(--muted);font-size:12px;margin:12px 0 5px}
input,select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);outline:none}input:focus,select:focus{border-color:#8bc5aa;box-shadow:0 0 0 3px #e9f5ef}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}
@media(max-width:900px){.schedule{grid-template-columns:repeat(7,minmax(120px,1fr));overflow-x:auto;padding-bottom:6px}.day{min-height:180px}}
@media(max-width:650px){header{padding:11px 14px}.brand small{display:none}.brand b{font-size:16px}main{padding:20px 12px 40px}.top{align-items:flex-start;gap:10px}.top h1{font-size:24px}.grid{gap:9px}.stat{padding:13px}.stat strong{font-size:23px}.quick{grid-template-columns:1fr}.schedule{grid-template-columns:repeat(7,118px);overflow-x:auto;padding-bottom:8px}.day{min-height:185px}}
</style>
</head>
<body>
<header><div class="head"><div class="brand"><div class="logo">APLUS<br>ACHIEVER</div><div><b>家庭教育管理平台</b><small>让家庭课程、日程、接送与费用一目了然</small></div></div><button onclick="openStudent()">＋ 添加学生</button></div></header>
<main>
<div class="top"><div><h1>家庭首页</h1><p id="today"></p></div><div class="row"><button onclick="openStudent()">＋ 孩子</button><button class="primary" onclick="openEvent()">＋ 添加日程</button></div></div>
<div class="grid">
<div class="stat"><small>学生</small><strong id="studentCount">0</strong></div>
<div class="stat"><small>今天安排</small><strong id="todayCount">0</strong></div>
<div class="stat"><small>待处理冲突</small><strong id="conflictCount">0</strong></div>
<div class="stat"><small>本月费用</small><strong id="feeTotal">S$0</strong></div>
</div>
<div class="layout">
<section>
<div class="card"><div class="section-head"><h2>本周家庭日程</h2><button onclick="openEvent()">添加</button></div><div class="schedule" id="schedule"></div></div>
<div class="card"><div class="section-head"><h2>冲突提醒</h2></div><div id="conflicts"></div></div>
</section>
<aside>
<div class="card"><h2>孩子</h2><div id="students"></div></div>
<div class="card"><h2>本月费用</h2><div id="fees"></div></div>
<div class="card"><h2>常用操作</h2><div class="quick">
<button onclick="openStudent()"><b>孩子档案</b><span>新增或修改孩子</span></button>
<button onclick="openEvent()"><b>课程 / 活动</b><span>安排时间与费用</span></button>
<button onclick="exportData()"><b>备份资料</b><span>保存当前家庭资料</span></button>
<button onclick="clearData()"><b>清空测试资料</b><span>重新开始</span></button>
</div></div>
</aside>
</div>
</main>
<dialog id="dlg"><div class="modal" id="modal"></div></dialog>
<script>
const days=['周一','周二','周三','周四','周五','周六','周日'];
let db=JSON.parse(localStorage.getItem('education-os')||'null')||{students:[],events:[]};
const $=id=>document.getElementById(id), uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const save=()=>localStorage.setItem('education-os',JSON.stringify(db));
const student=id=>db.students.find(x=>x.id===id);
function money(n){return 'S$'+Number(n||0).toLocaleString('en-SG',{minimumFractionDigits:0,maximumFractionDigits:2})}
function conflicts(){let out=[];for(let d=0;d<7;d++){let a=db.events.filter(x=>x.day===d);for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++)if(a[i].s<a[j].e&&a[j].s<a[i].e){out.push({d,a:a[i],b:a[j],same:a[i].student===a[j].student})}}return out}
function render(){
 const now=new Date(), js=(now.getDay()+6)%7;
 $('today').textContent=now.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'})+' · '+days[js];
 $('studentCount').textContent=db.students.length;
 $('todayCount').textContent=db.events.filter(e=>e.day===js).length;
 $('conflictCount').textContent=conflicts().length;
 $('feeTotal').textContent=money(db.events.reduce((s,e)=>s+Number(e.fee||0),0));
 $('students').innerHTML=db.students.length?db.students.map(s=>'<div class="student"><div class="row"><div class="avatar">'+esc(s.name[0])+'</div><div><b>'+esc(s.name)+'</b><small style="display:block;color:var(--muted)">'+esc(s.grade||'未设置年级')+'</small></div></div><button onclick="editStudent(\''+s.id+'\')">修改</button></div>').join(''):'<div class="empty">还没有学生，先添加孩子</div>';
 $('schedule').innerHTML=days.map((d,i)=>'<div class="day"><h3>'+d+'</h3>'+db.events.filter(e=>e.day===i).sort((a,b)=>a.s.localeCompare(b.s)).map(e=>{let s=student(e.student),bad=conflicts().some(c=>(c.a.id===e.id||c.b.id===e.id)&&c.same);return '<div class="event '+(bad?'conflict':'')+'" onclick="editEvent(\''+e.id+'\')"><b>'+e.s+'–'+e.e+' '+esc(e.name)+'</b><small>'+(s?esc(s.name):'未指定')+' · '+esc(e.type)+(e.fee?' · '+money(e.fee):'')+'</small></div>'}).join('')||'<div class="empty">—</div></div>').join('');
 let cs=conflicts();$('conflicts').innerHTML=cs.length?cs.map(c=>'<div class="alert '+(c.same?'red':'')+'">'+days[c.d]+' '+c.a.s+'–'+c.a.e+'：'+esc(student(c.a.student)?.name||'')+'「'+esc(c.a.name)+'」与'+esc(student(c.b.student)?.name||'')+'「'+esc(c.b.name)+'」时间重叠'+(c.same?'，需要调整':'，接送时请注意')+'</div>').join(''):'<div class="empty">没有发现时间冲突</div>';
 let by={};db.events.forEach(e=>{let k=e.student+'|'+e.type+'|'+e.name;if(e.fee)by[k]=Math.max(by[k]||0,Number(e.fee))});let total=Object.values(by).reduce((a,b)=>a+b,0);
 $('fees').innerHTML=Object.entries(by).length?Object.entries(by).map(([k,v])=>{let [sid,t,n]=k;return '<div class="money"><span>'+esc(student(sid)?.name||'')+' · '+esc(n)+'</span><b>'+money(v)+'</b></div>'}).join('')+'<div class="total">合计 '+money(total)+'</div>':'<div class="empty">暂无费用</div>';
}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function openStudent(id){let s=student(id)||{name:'',grade:''};$('modal').innerHTML='<h2>'+(id?'修改孩子':'添加孩子')+'</h2><label>孩子姓名</label><input id="sn" value="'+esc(s.name)+'"><label>年级</label><input id="sg" value="'+esc(s.grade)+'" placeholder="如：P4 / Secondary 2"><div class="row" style="justify-content:flex-end;margin-top:16px"><button onclick="dlg.close()">取消</button><button class="primary" onclick="saveStudent(\''+(id||'')+'\')">保存</button></div>';$('dlg').showModal()}
function saveStudent(id){let n=$('sn').value.trim();if(!n)return alert('请填写孩子姓名');if(id){let s=student(id);s.name=n;s.grade=$('sg').value.trim()}else db.students.push({id:uid(),name:n,grade:$('sg').value.trim()});save();dlg.close();render()}
function editStudent(id){openStudent(id)}
function openEvent(id){if(!db.students.length){openStudent();return}let e=db.events.find(x=>x.id===id)||{student:db.students[0].id,type:'补习',name:'',day:0,s:'16:00',e:'17:00',fee:''};$('modal').innerHTML='<h2>'+(id?'修改日程':'添加日程')+'</h2><label>孩子</label><select id="es">'+db.students.map(s=>'<option value="'+s.id+'" '+(s.id===e.student?'selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select><label>类型</label><select id="et"><option '+(e.type==='补习'?'selected':'')+'>补习</option><option '+(e.type==='活动'?'selected':'')+'>活动</option><option '+(e.type==='其他'?'selected':'')+'>其他</option></select><label>课程 / 活动</label><input id="en" value="'+esc(e.name)+'" placeholder="如：数学、钢琴、游泳"><label>星期</label><select id="ed">'+days.map((d,i)=>'<option value="'+i+'" '+(i===e.day?'selected':'')+'>'+d+'</option>').join('')+'</select><label>时间</label><div class="row"><input type="time" id="eb" value="'+e.s+'"><input type="time" id="ee" value="'+e.e+'"></div><label>每月费用</label><input type="number" id="ef" value="'+(e.fee||'')+'" placeholder="如 320"><div class="row" style="justify-content:space-between;margin-top:16px"><div>'+(id?'<button onclick="deleteEvent(\''+id+'\')">删除</button>':'')+'</div><div class="row"><button onclick="dlg.close()">取消</button><button class="primary" onclick="saveEvent(\''+(id||'')+'\')">保存</button></div></div>';$('dlg').showModal()}
function editEvent(id){openEvent(id)}
function saveEvent(id){let o={id:id||uid(),student:$('es').value,type:$('et').value,name:$('en').value.trim(),day:+$('ed').value,s:$('eb').value,e:$('ee').value,fee:Number($('ef').value||0)};if(!o.name)return alert('请填写课程或活动');if(!o.s||!o.e||o.e<=o.s)return alert('请检查时间');if(id)db.events=db.events.map(x=>x.id===id?o:x);else db.events.push(o);save();dlg.close();render()}
function deleteEvent(id){if(confirm('确定删除这项日程？')){db.events=db.events.filter(x=>x.id!==id);save();dlg.close();render()}}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='教育管家备份.json';a.click()}
function clearData(){if(confirm('确定清空当前浏览器中的测试资料？')){db={students:[],events:[]};save();render()}}
render();
</script>
</body>
</html>
