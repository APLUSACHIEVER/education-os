<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APLUS ACHIEVER 教育管家</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1f2430;--mut:#6b7280;--bd:#e3e6ec;--pri:#3b6cf6;--bad:#d92d20;--badbg:#fdecea;--warn:#b45309;--warnbg:#fff4e0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1d2026;--tx:#e8eaee;--mut:#9aa1ad;--bd:#2d323b;--pri:#6b93ff;--bad:#ff7b72;--badbg:#3a1f1d;--warn:#f0b35a;--warnbg:#3a2e17}}
:root[data-theme="dark"]{--bg:#14161a;--card:#1d2026;--tx:#e8eaee;--mut:#9aa1ad;--bd:#2d323b;--pri:#6b93ff;--bad:#ff7b72;--badbg:#3a1f1d;--warn:#f0b35a;--warnbg:#3a2e17}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:1100px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0;display:flex;align-items:center;gap:10px}.brand-logo{height:34px;width:auto;max-width:180px;object-fit:contain;display:block}h2{font-size:16px;margin:0 0 8px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.alert{border-radius:8px;padding:8px 10px;margin:4px 0;font-size:14px}
.alert.bad{background:var(--badbg);color:var(--bad)}.alert.warn{background:var(--warnbg);color:var(--warn)}.ok{color:var(--mut)}
.scroll{overflow-x:auto}
.week{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:6px;min-width:930px}
.day h3{margin:0 0 6px;font-size:14px;text-align:center;color:var(--mut)}
.item{border-left:5px solid var(--c);background:var(--bg);border-radius:8px;padding:6px 8px;margin-bottom:6px;font-size:13px;cursor:pointer}
.item.bad{background:var(--badbg);outline:2px solid var(--bad)}.item.warn{background:var(--warnbg);outline:2px dashed var(--warn)}.item.cancel{opacity:.45;text-decoration:line-through}.today-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}.today-empty{padding:10px;text-align:center;color:var(--mut);background:var(--bg);border-radius:8px}.click-row{cursor:pointer}.click-row:hover{background:var(--bg)}
.item b{display:block}.item small{color:var(--mut)}
table{width:100%;border-collapse:collapse}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left}td.n,th.n{text-align:right}
tr.tot td{font-weight:700}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);width:min(420px,92vw)}
dialog::backdrop{background:#0006}
label{display:block;margin:8px 0 2px;font-size:13px;color:var(--mut)}
dialog input,dialog select{width:100%}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:4px}
.legend{font-size:12px;color:var(--mut);margin-top:6px}.week-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}.week-range{font-weight:700;font-size:15px}.week-stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.week-stat{background:var(--bg);border-radius:8px;padding:6px 10px;font-size:13px}.day.today{outline:2px solid var(--pri);outline-offset:-2px;border-radius:9px}.day h3 small{display:block;font-size:11px;font-weight:400}.date-picker{margin-top:6px}.date-tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.date-tools button{font-size:13px}.months{display:grid;grid-template-columns:repeat(2,minmax(260px,1fr));gap:10px}.month{border:1px solid var(--bd);border-radius:10px;padding:8px}.month-title{font-weight:700;margin-bottom:6px}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal b{font-size:11px;color:var(--mut);text-align:center;padding:3px}.cal button{padding:6px 2px;font-size:12px}.cal button.on{background:var(--pri);border-color:var(--pri);color:#fff}.cal button.att{box-shadow:inset 0 -3px 0 #2f9e44}.cal button.cancel{opacity:.45;text-decoration:line-through}.summary-box{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.summary-box>div{background:var(--bg);border-radius:9px;padding:8px;text-align:center}.summary-box strong{display:block;font-size:20px}.progress{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:var(--pri)}@media(max-width:700px){.months{grid-template-columns:1fr}}@media(max-width:520px){.summary-box{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<main>
  <div class="bar">
    <h1><img class="brand-logo" src="https://raw.githubusercontent.com/APLUSACHIEVER/aplus-achiever-website/main/assets/logo.png" alt="APLUS ACHIEVER"><span>APLUS ACHIEVER 家庭教育管理平台</span></h1>
    <div class="row">
      <button class="pri" id="addBtn">＋ 新增课程 / 课时包</button>
      <button id="stuBtn">学生</button>
      <button id="expBtn">备份</button>
      <button id="impBtn">恢复</button>
      <input type="file" id="impFile" accept=".json" hidden>
    </div>
  </div>
  <div class="row" id="filter" style="margin-bottom:12px"></div>

  <div class="card" id="studentPanel" hidden>
  <div class="bar" style="margin-bottom:8px"><h2>👨‍👩‍👧 学生管理</h2><button type="button" id="studentClose">收起</button></div>
  <div id="studentList"></div>
  <div class="row" style="margin-top:10px">
    <input id="studentNameInput" placeholder="输入学生姓名" style="flex:1">
    <button type="button" class="pri" id="studentAddBtn">添加学生</button>
  </div>
</div>

  <div class="card"><h2>📌 今天</h2><div id="todayList" class="today-list"></div></div>
  <div class="card"><h2>⚠️ 冲突检查</h2><div id="conf"></div></div>
  <div class="card"><div class="bar" style="margin-bottom:8px"><h2>📅 全家周日程</h2><div class="row"><button id="prevWeek">← 上一周</button><button id="thisWeek">本周</button><button id="nextWeek">下一周 →</button></div></div><div class="week-head"><div class="week-range" id="weekRange"></div><div class="legend">默认显示全部孩子，可点击上方孩子筛选。</div></div><div class="week-stats" id="weekStats"></div><div class="scroll"><div class="week" id="week"></div></div><div class="legend">红框＝同一学生时间重叠（必须调整）；橙色虚线＝不同学生同时有课（家长接送需注意）。点击课程卡片可直接编辑。</div></div>
  <div class="card"><div class="bar" style="margin-bottom:8px"><h2>💰 课程 / 课时包</h2><button type="button" class="pri" id="addFeeBtn">＋ 新增课时包</button></div><div class="legend">每个课程都可以单独设置课时日期、上课时间和费用；点击下面的课程即可修改。</div><div class="scroll" id="fees"></div></div>
<div class="legend" style="text-align:center;margin:18px 0 6px">教育管家 · 2026.10.03</div>
</main>

<dialog id="dlg"><div id="dlgBody"></div></dialog>

<script>
const DAYS=['周一','周二','周三','周四','周五','周六','周日'];
const COLORS=['#3b6cf6','#e8590c','#2f9e44','#ae3ec9','#0c8599','#d6336c'];
let db={students:[],items:[]};   // items: {id,stu,type,name,dates,s,e,fee,note,statusByDate:{date:'attended'|'leave'|'cancelled'}}
let sel='all';
let weekStart=startOfWeek(new Date());
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const money=n=>'S

function load(){try{const t=localStorage.getItem('edu-butler');if(t){const d=JSON.parse(t);if(d&&Array.isArray(d.students)&&Array.isArray(d.items))db=d}}catch(e){}}
function save(){try{localStorage.setItem('edu-butler',JSON.stringify(db))}catch(e){}}
const stu=id=>db.students.find(s=>s.id===id);
function getDays(i){return Array.isArray(i.days)&&i.days.length?i.days:[Number.isInteger(i.day)?i.day:0]}
function pad(n){return String(n).padStart(2,'0')}
function startOfWeek(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const mon=(x.getDay()+6)%7;x.setDate(x.getDate()-mon);x.setHours(0,0,0,0);return x}
function weekDates(){return DAYS.map((_,k)=>{const x=new Date(weekStart);x.setDate(x.getDate()+k);return iso(x.getFullYear(),x.getMonth()+1,x.getDate())})}
function weekRangeText(){const a=weekDates(),x=parseDate(a[0]),y=parseDate(a[6]);return x.getFullYear()+'年'+(x.getMonth()+1)+'月'+x.getDate()+'日 – '+(y.getMonth()+1)+'月'+y.getDate()+'日'}
function iso(y,m,d){return y+'-'+pad(m)+'-'+pad(d)}
function parseDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function fmtDate(s){const [y,m,d]=s.split('-').map(Number);return y+'年'+m+'月'+d+'日'}
function itemDates(i){
  if(Array.isArray(i.dates)&&i.dates.length)return i.dates.slice().sort();
  const now=new Date(),out=[],days=getDays(i);
  for(let k=0;k<21;k++){const x=new Date(now);x.setDate(now.getDate()+k);const mon=(x.getDay()+6)%7;if(days.includes(mon))out.push(iso(x.getFullYear(),x.getMonth()+1,x.getDate()))}
  return out;
}
function statusOf(i,d){return i.statusByDate&&i.statusByDate[d]||'scheduled'}
function sessionStats(i){const ds=itemDates(i),cancel=ds.filter(d=>statusOf(i,d)==='cancelled').length,att=ds.filter(d=>statusOf(i,d)==='attended').length,active=ds.length-cancel;return {total:active,attended:att,remaining:Math.max(0,active-att)}}
function dateColorClass(i,d){const st=statusOf(i,d);return st==='attended'?'att':st==='cancelled'?'cancel':''}
function overlap(a,b){return a.s<b.e&&b.s<a.e}

function conflicts(){
  const bad=new Set(),warn=new Set(),msgs=[],seen=new Set();
  const allDates=[...new Set(db.items.flatMap(i=>itemDates(i)))].sort();
  for(const date of allDates){
    const L=db.items.filter(i=>statusOf(i,date)!=='cancelled'&&itemDates(i).includes(date));
    for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){
      const a=L[i],b=L[j];if(!overlap(a,b))continue;
      const same=a.stu===b.stu,na=(stu(a.stu)||{}).name||'?',nb=(stu(b.stu)||{}).name||'?';
      const key=[date,a.id,b.id].sort().join('|');if(seen.has(key))continue;seen.add(key);
      (same?bad:warn).add(a.id);(same?bad:warn).add(b.id);
      msgs.push({bad:same,date,t:fmtDate(date)+'：'+(same?na+' 的':na+' 与 '+nb+' 的')+'「'+a.name+' '+a.s+'-'+a.e+'」和「'+b.name+' '+b.s+'-'+b.e+'」时间重叠'+(same?'（冲突）':'（接送注意）')});
    }
  }
  msgs.sort((x,y)=>Number(y.bad)-Number(x.bad)||x.date.localeCompare(y.date));
  return{bad,warn,msgs};
}

function render(){
  $('filter').innerHTML='<button class="chip '+(sel==='all'?'on':'')+'" data-s="all">全部</button>'+
    db.students.map(s=>'<button class="chip '+(sel===s.id?'on':'')+'" data-s="'+s.id+'"><span class="dot" style="--c:'+s.color+'"></span>'+esc(s.name)+'</button>').join('');
  const c=conflicts();
  $('conf').innerHTML=c.msgs.length?'<div class="alert '+(c.msgs.some(m=>m.bad)?'bad':'warn')+'">'+(c.msgs.some(m=>m.bad)?'⚠️ 有 '+c.msgs.filter(m=>m.bad).length+' 个时间冲突':'🟠 有 '+c.msgs.length+' 个接送提醒')+'</div>'+c.msgs.slice(0,8).map(m=>'<div class="alert '+(m.bad?'bad':'warn')+'">'+esc(m.t)+'</div>').join(''):'<div class="ok">✅ 暂无冲突</div>';
  const today=iso(new Date().getFullYear(),new Date().getMonth()+1,new Date().getDate());
  const todayItems=db.items.flatMap(i=>itemDates(i).filter(d=>d===today).map(d=>({i,d}))).sort((a,b)=>a.i.s.localeCompare(b.i.s));
  $('todayList').innerHTML=todayItems.length?todayItems.map(({i,d})=>{const s=stu(i.stu)||{name:'?',color:'#888'},st=sessionStats(i),status=statusOf(i,d),sl={scheduled:'未上',attended:'已上',leave:'请假',cancelled:'取消'}[status]||'未上';return '<div class="item '+(status==='cancelled'?'cancel':'')+'" style="--c:'+s.color+'" data-id="'+i.id+'"><b>'+i.s+'-'+i.e+'　'+esc(i.name)+'</b><small>'+esc(s.name)+' · '+i.type+' · '+sl+' · 剩余 '+st.remaining+' 节'+(i.fee?' · '+money(i.fee):'')+(i.note?'<br>'+esc(i.note):'')+'</small></div>'}).join(''):'<div class="today-empty">今天没有课程或活动</div>';

  const dates=weekDates(), today=iso(new Date().getFullYear(),new Date().getMonth()+1,new Date().getDate());
  $('weekRange').textContent=weekRangeText();
  const vis=db.items.filter(i=>sel==='all'||i.stu===sel);
  const weekItems=vis.flatMap(i=>itemDates(i).filter(d=>dates.includes(d)).map(d=>({i,d})));
  const weekActive=weekItems.filter(x=>statusOf(x.i,x.d)!=='cancelled');
  const weekAtt=weekItems.filter(x=>statusOf(x.i,x.d)==='attended');
  const weekBad=c.msgs.filter(m=>dates.includes(m.date)&&m.bad).length;
  $('weekStats').innerHTML='<div class="week-stat">本周课程 <b>'+weekActive.length+'</b> 节</div><div class="week-stat">已上 <b>'+weekAtt.length+'</b> 节</div><div class="week-stat">待上 <b>'+Math.max(0,weekActive.length-weekAtt.length)+'</b> 节</div><div class="week-stat">'+(weekBad?'⚠️ 冲突':'✅ 无冲突')+' <b>'+weekBad+'</b></div>';

  $('week').innerHTML=dates.map((date,d)=>{
    const x=parseDate(date), list=weekItems.filter(x=>x.d===date).sort((a,b)=>a.i.s.localeCompare(b.i.s));
    return '<div class="day '+(date===today?'today':'')+'"><h3>'+DAYS[d]+'<small>'+ (x.getMonth()+1)+'/'+x.getDate()+'</small></h3>'+
      (list.map(({i,d})=>{
        const s=stu(i.stu)||{name:'?',color:'#888'},st=sessionStats(i),status=statusOf(i,d),cls=c.bad.has(i.id)?'bad':c.warn.has(i.id)?'warn':'';
        const sl={scheduled:'未上',attended:'已上',leave:'请假',cancelled:'取消'}[status]||'未上';
        return '<div class="item '+cls+(status==='cancelled'?' cancel':'')+'" style="--c:'+s.color+'" data-id="'+i.id+'" data-date="'+d+'"><b>'+i.s+'-'+i.e+' '+esc(i.name)+'</b><small>'+esc(s.name)+' · '+i.type+' · '+sl+' · 剩余 '+st.remaining+' 节'+(i.fee?' · '+money(i.fee):'')+(i.note?'<br>'+esc(i.note):'')+'</small></div>';
      }).join('')||'<div class="ok" style="text-align:center">—</div>')+'</div>';
  }).join('');

  let h='<table><tr><th>学生</th><th>课程</th><th>进度</th><th class="n">课费包</th></tr>';
  const groups=new Map();
  vis.filter(i=>i.type==='补习'||i.fee>0).forEach(i=>{const k=i.stu+'|'+i.type+'|'+i.name;const o=groups.get(k)||{i,fee:0};o.fee=Math.max(o.fee,i.fee||0);groups.set(k,o)});
  let total=0;
  [...groups.values()].sort((a,b)=>a.i.name.localeCompare(b.i.name)).forEach(o=>{const st=sessionStats(o.i);total+=o.fee;h+='<tr class="click-row" data-fee-id="'+o.i.id+'" title="点击查看课程">'+'<td>'+esc((stu(o.i.stu)||{}).name)+'</td><td>'+esc(o.i.name)+'</td><td>'+st.attended+' / '+st.total+' 节 <span class="legend">（剩 '+st.remaining+'）</span></td><td class="n">'+money(o.fee)+'</td></tr>'});
  h+='<tr class="tot"><td colspan="3">课费包合计</td><td class="n">'+money(total)+'</td></tr></table>';
  $('fees').innerHTML=h||'<div class="ok">暂无课费包</div>';
}
// 课费包：同一学生+类型+名称只计算一次，多天上课共用同一个课费包
function sum(sid,type){
  const m=new Map();
  db.items.filter(i=>i.stu===sid&&i.type===type&&i.fee>0).forEach(i=>m.set(i.name,Math.max(m.get(i.name)||0,i.fee)));
  let t=0;m.forEach(v=>t+=v);return t;
}

function openItem(id){
  if(!db.students.length){alert('请先在「学生」里添加学生');return}
  const it=db.items.find(i=>i.id===id)||{stu:sel!=='all'?sel:db.students[0].id,type:'补习',name:'',dates:[],s:'16:00',e:'17:00',fee:'',note:'',statusByDate:{}};
  it.statusByDate=it.statusByDate||{};
  let selected=new Set(Array.isArray(it.dates)?it.dates:[]);
  let base=selected.size?[...selected].sort()[0]:iso(new Date().getFullYear(),new Date().getMonth()+1,1);
  let end=selected.size?[...selected].sort().slice(-1)[0]:iso(new Date().getFullYear(),new Date().getMonth()+3,1);
  const monthList=()=>{const a=parseDate(base),b=parseDate(end),out=[];let y=a.getFullYear(),m=a.getMonth();const by=b.getFullYear()*12+b.getMonth();while(y*12+m<=by&&out.length<12){out.push([y,m]);m++;if(m===12){m=0;y++}}return out};
  const drawDates=()=>{
    const months=monthList();
    $('dateArea').innerHTML=months.map(([y,m])=>{
      const first=new Date(y,m,1),last=new Date(y,m+1,0),lead=(first.getDay()+6)%7;
      let cells='';for(let i=0;i<lead;i++)cells+='<span></span>';
      for(let d=1;d<=last.getDate();d++){const ds=iso(y,m+1,d),on=selected.has(ds),st=it.statusByDate[ds]||'scheduled';cells+=`<button type="button" data-date="${ds}" class="${on?'on ':''}${st==='attended'?'att ':''}${st==='cancelled'?'cancel':''}">${d}</button>`}
      return `<div class="month"><div class="month-title">${y}年${m+1}月</div><div class="cal"><b>一</b><b>二</b><b>三</b><b>四</b><b>五</b><b>六</b><b>日</b>${cells}</div></div>`
    }).join('');
    $('dateArea').querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{const d=b.dataset.date;if(selected.has(d)){selected.delete(d)}else{selected.add(d);if(!it.statusByDate[d])it.statusByDate[d]='scheduled'}drawDates();updateSummary()});
  };
  $('dlgBody').innerHTML=`<h2>${id?'编辑':'添加'}课程</h2>
  <label>学生</label><select id="f_stu">${db.students.map(s=>`<option value="${s.id}" ${s.id===it.stu?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
  <label>类型</label><select id="f_type"><option ${it.type==='补习'?'selected':''}>补习</option><option ${it.type==='活动'?'selected':''}>活动</option></select>
  <label>科目 / 活动名称</label><input id="f_name" value="${esc(it.name)}" placeholder="如：数学、钢琴">
  <label>上课时间</label><div class="row"><input type="time" id="f_s" value="${it.s}" style="width:48%"><input type="time" id="f_e" value="${it.e}" style="width:48%"></div>
  <label>选择实际课程日期</label>
  <div class="date-tools"><input type="date" id="range_s" value="${base}"><input type="date" id="range_e" value="${end}"><button type="button" id="applyRange">显示日期</button><button type="button" id="clearDates">清除全部</button></div>
  <div class="legend">直接点击日期即可 Tick / 取消。日期可以完全灵活，不要求固定每周。</div>
  <div id="dateArea" class="months date-picker"></div>
  <div class="summary-box"><div><span>计划</span><strong id="sumTotal">0</strong>节</div><div><span>已上</span><strong id="sumAtt">0</strong>节</div><div><span>剩余</span><strong id="sumRemain">0</strong>节</div></div>
  <div class="progress"><i id="sumBar" style="width:0%"></i></div>
  <label id="feeLabel">课时包总费用${it.type==='补习'?'（必填）':'（如有费用请填写）'}</label><input type="number" min="0" id="f_fee" value="${it.fee}">
  <label>备注（老师/地点）</label><input id="f_note" value="${esc(it.note)}">
  ${id?'<label>已选课程的上课记录</label><div id="statusArea"></div>':''}
  <div class="row" style="margin-top:14px;justify-content:space-between"><div>${id?'<button id="f_del">删除</button>':''}</div><div class="row"><button id="f_cancel">取消</button><button class="pri" id="f_ok">保存课程</button></div></div>`;
  $('dlg').showModal();
  $('f_type').onchange=()=>{$('feeLabel').textContent='课时包总费用'+($('f_type').value==='补习'?'（必填）':'（如有费用请填写）')};
  const updateSummary=()=>{const temp={...it,dates:[...selected]};const st=sessionStats(temp);$('sumTotal').textContent=st.total;$('sumAtt').textContent=st.attended;$('sumRemain').textContent=st.remaining;$('sumBar').style.width=(st.total?Math.round(st.attended/st.total*100):0)+'%';if($('statusArea')){$('statusArea').innerHTML=[...selected].sort().map(d=>`<div class="row" style="justify-content:space-between;margin:4px 0"><span>${fmtDate(d)}</span><select data-status="${d}"><option value="scheduled" ${statusOf(it,d)==='scheduled'?'selected':''}>未上</option><option value="attended" ${statusOf(it,d)==='attended'?'selected':''}>已上</option><option value="leave" ${statusOf(it,d)==='leave'?'selected':''}>请假</option><option value="cancelled" ${statusOf(it,d)==='cancelled'?'selected':''}>取消</option></select></div>`).join('');$('statusArea').querySelectorAll('[data-status]').forEach(s=>s.onchange=()=>{it.statusByDate[s.dataset.status]=s.value;drawDates();updateSummary()})}};
  $('applyRange').onclick=()=>{base=$('range_s').value;end=$('range_e').value;if(!base||!end||base>end)return alert('日期范围不正确');drawDates()};
  $('clearDates').onclick=()=>{selected.clear();drawDates();updateSummary()};
  drawDates();updateSummary();
  $('f_cancel').onclick=()=>$('dlg').close();
  if(id)$('f_del').onclick=()=>{if(confirm('确定删除整门课程？')){db.items=db.items.filter(i=>i.id!==id);save();render();$('dlg').close()}};
  $('f_ok').onclick=()=>{
    const dates=[...selected].sort(),fee=Math.max(0,+$('f_fee').value||0);
    if(!$('f_name').value.trim())return alert('请填写课程名称');
    if(!dates.length)return alert('请至少选择一个课程日期');
    if($('f_type').value==='补习'&&fee<=0)return alert('补习课程必须填写课时包费用');
    const o={id:id||uid(),stu:$('f_stu').value,type:$('f_type').value,name:$('f_name').value.trim(),dates,s:$('f_s').value,e:$('f_e').value,fee,note:$('f_note').value.trim(),statusByDate:it.statusByDate||{}};
    if(!o.s||!o.e||o.e<=o.s)return alert('结束时间必须晚于开始时间');
    db.items=id?db.items.map(i=>i.id===id?o:i):[...db.items,o];save();render();$('dlg').close();
  };
}
function renderStudentPanel(){
  const panel=$('studentPanel'),list=$('studentList');
  if(!panel||!list)return;
  list.innerHTML=db.students.map(s=>`<div class="row click-row" style="justify-content:space-between;padding:7px 4px;border-bottom:1px solid var(--bd)">
    <span><span class="dot" style="--c:${s.color}"></span>${esc(s.name)}</span>
    <span class="row"><button type="button" data-sren="${s.id}">改名</button><button type="button" data-sdel="${s.id}">删除</button></span>
  </div>`).join('')||'<div class="ok" style="padding:8px 0">还没有学生，请先添加。</div>';
  list.querySelectorAll('[data-sren]').forEach(b=>{
    b.onclick=()=>{
      const s=stu(b.dataset.sren); if(!s)return;
      const row=b.closest('.row');
      row.innerHTML=`<input id="rename_${s.id}" value="${esc(s.name)}" style="flex:1"><button type="button" class="pri" id="save_${s.id}">保存</button><button type="button" id="cancel_${s.id}">取消</button>`;
      $(`save_${s.id}`).onclick=()=>{
        const n=$(`rename_${s.id}`).value.trim();
        if(!n){$(`rename_${s.id}`).focus();return}
        s.name=n;save();renderStudentPanel();render();
      };
      $(`cancel_${s.id}`).onclick=renderStudentPanel;
      $(`rename_${s.id}`).focus();
    };
  });
  list.querySelectorAll('[data-sdel]').forEach(b=>b.onclick=()=>{
    const s=stu(b.dataset.sdel); if(!s)return;
    if(confirm(`删除「${s.name}」及其所有安排？`)){
      db.students=db.students.filter(x=>x.id!==s.id);
      db.items=db.items.filter(i=>i.stu!==s.id);
      if(sel===s.id)sel='all';
      save();renderStudentPanel();render();
    }
  });
}
function openStu(){
  const panel=$('studentPanel');
  if(!panel)return;
  panel.hidden=!panel.hidden;
  if(!panel.hidden){
    renderStudentPanel();
    panel.scrollIntoView({behavior:'smooth',block:'nearest'});
    setTimeout(()=>$('studentNameInput')?.focus(),100);
  }
}
$('studentAddBtn').onclick=()=>{
  const input=$('studentNameInput');
  const n=input.value.trim();
  if(!n){input.focus();return}
  const newStudent={id:uid(),name:n,color:COLORS[db.students.length%COLORS.length]};
  db.students.push(newStudent);save();sel=newStudent.id;input.value='';
  renderStudentPanel();render();input.focus();
};
$('studentNameInput').onkeydown=e=>{if(e.key==='Enter')$('studentAddBtn').click()};
$('addFeeBtn').onclick=()=>openItem();
$('studentClose').onclick=()=>{$('studentPanel').hidden=true};

$('addBtn').onclick=()=>openItem();
$('stuBtn').onclick=openStu;
$('filter').onclick=e=>{const b=e.target.closest('[data-s]');if(b){sel=b.dataset.s;render()}};
$('week').onclick=e=>{const b=e.target.closest('[data-id]');if(b)openItem(b.dataset.id)};
$('todayList').onclick=e=>{const b=e.target.closest('[data-id]');if(b)openItem(b.dataset.id)};
$('fees').onclick=e=>{const b=e.target.closest('[data-fee-id]');if(b)openItem(b.dataset.feeId)};
$('prevWeek').onclick=()=>{weekStart=new Date(weekStart);weekStart.setDate(weekStart.getDate()-7);render()};
$('thisWeek').onclick=()=>{weekStart=startOfWeek(new Date());render()};
$('nextWeek').onclick=()=>{weekStart=new Date(weekStart);weekStart.setDate(weekStart.getDate()+7);render()};
$('expBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='教育管家备份.json';a.click()};
$('impBtn').onclick=()=>$('impFile').click();
$('impFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.students)||!Array.isArray(d.items))throw 0;if(confirm('将覆盖当前数据，继续？')){db=d;sel='all';save();render()}}catch(x){alert('备份文件格式不正确')}};r.readAsText(f);e.target.value=''};

load();render();
if(!db.students.length)openStu();
</script>
</body>
</html>
