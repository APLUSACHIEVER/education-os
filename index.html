<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>教育管家</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1f2430;--mut:#6b7280;--bd:#e3e6ec;--pri:#3b6cf6;--bad:#d92d20;--badbg:#fdecea;--warn:#b45309;--warnbg:#fff4e0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1d2026;--tx:#e8eaee;--mut:#9aa1ad;--bd:#2d323b;--pri:#6b93ff;--bad:#ff7b72;--badbg:#3a1f1d;--warn:#f0b35a;--warnbg:#3a2e17}}
:root[data-theme="dark"]{--bg:#14161a;--card:#1d2026;--tx:#e8eaee;--mut:#9aa1ad;--bd:#2d323b;--pri:#6b93ff;--bad:#ff7b72;--badbg:#3a1f1d;--warn:#f0b35a;--warnbg:#3a2e17}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:1100px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 8px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.alert{border-radius:8px;padding:8px 10px;margin:4px 0;font-size:14px}
.alert.bad{background:var(--badbg);color:var(--bad)}.alert.warn{background:var(--warnbg);color:var(--warn)}.ok{color:var(--mut)}
.scroll{overflow-x:auto}
.week{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:6px;min-width:930px}
.day h3{margin:0 0 6px;font-size:14px;text-align:center;color:var(--mut)}
.item{border-left:5px solid var(--c);background:var(--bg);border-radius:8px;padding:6px 8px;margin-bottom:6px;font-size:13px;cursor:pointer}
.item.bad{background:var(--badbg);outline:2px solid var(--bad)}.item.warn{background:var(--warnbg);outline:2px dashed var(--warn)}
.item b{display:block}.item small{color:var(--mut)}
table{width:100%;border-collapse:collapse}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left}td.n,th.n{text-align:right}
tr.tot td{font-weight:700}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);width:min(420px,92vw)}
dialog::backdrop{background:#0006}
label{display:block;margin:8px 0 2px;font-size:13px;color:var(--mut)}
dialog input,dialog select{width:100%}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:4px}
.legend{font-size:12px;color:var(--mut);margin-top:6px}
</style>
</head>
<body>
<main>
  <div class="bar">
    <h1>📚 教育管家</h1>
    <div class="row">
      <button class="pri" id="addBtn">＋ 添加安排</button>
      <button id="stuBtn">学生</button>
      <button id="expBtn">备份</button>
      <button id="impBtn">恢复</button>
      <input type="file" id="impFile" accept=".json" hidden>
    </div>
  </div>
  <div class="row" id="filter" style="margin-bottom:12px"></div>

  <div class="card"><h2>⚠️ 冲突检查</h2><div id="conf"></div></div>
  <div class="card"><h2>🗓 每周日程</h2><div class="scroll"><div class="week" id="week"></div></div>
    <div class="legend">红框＝同一学生时间重叠（必须调整）；橙色虚线＝不同学生同时有课（家长接送需注意）。点击卡片可编辑。</div></div>
  <div class="card"><h2>💰 每月费用</h2><div class="scroll" id="fees"></div></div>
</main>

<dialog id="dlg"><div id="dlgBody"></div></dialog>

<script>
const DAYS=['周一','周二','周三','周四','周五','周六','周日'];
const COLORS=['#3b6cf6','#e8590c','#2f9e44','#ae3ec9','#0c8599','#d6336c'];
let db={students:[],items:[]};   // items: {id,stu,type,name,day,s,e,fee,note}
let sel='all';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const money=n=>'¥'+(Math.round(n*100)/100).toLocaleString();

function load(){try{const t=localStorage.getItem('edu-butler');if(t){const d=JSON.parse(t);if(d&&Array.isArray(d.students)&&Array.isArray(d.items))db=d}}catch(e){}}
function save(){try{localStorage.setItem('edu-butler',JSON.stringify(db))}catch(e){}}
const stu=id=>db.students.find(s=>s.id===id);
function overlap(a,b){return a.s<b.e&&b.s<a.e}

function conflicts(){
  const bad=new Set(),warn=new Set(),msgs=[];
  for(let d=0;d<7;d++){
    const L=db.items.filter(i=>i.day===d);
    for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){
      const a=L[i],b=L[j];if(!overlap(a,b))continue;
      const same=a.stu===b.stu,na=(stu(a.stu)||{}).name,nb=(stu(b.stu)||{}).name;
      (same?bad:warn).add(a.id);(same?bad:warn).add(b.id);
      msgs.push({bad:same,t:`${DAYS[d]}：${same?na+' 的':na+' 与 '+nb+' 的'}「${a.name} ${a.s}-${a.e}」和「${b.name} ${b.s}-${b.e}」时间重叠${same?'（冲突）':'（接送注意）'}`});
    }
  }
  msgs.sort((x,y)=>y.bad-x.bad);
  return{bad,warn,msgs};
}

function render(){
  // filter chips
  $('filter').innerHTML=`<button class="chip ${sel==='all'?'on':''}" data-s="all">全部</button>`+
    db.students.map(s=>`<button class="chip ${sel===s.id?'on':''}" data-s="${s.id}"><span class="dot" style="--c:${s.color}"></span>${esc(s.name)}</button>`).join('');
  const c=conflicts();
  // conflicts (always checks all students)
  $('conf').innerHTML=c.msgs.length?c.msgs.map(m=>`<div class="alert ${m.bad?'bad':'warn'}">${esc(m.t)}</div>`).join(''):'<div class="ok">✅ 暂无冲突</div>';
  // week
  const vis=db.items.filter(i=>sel==='all'||i.stu===sel);
  $('week').innerHTML=DAYS.map((n,d)=>{
    const L=vis.filter(i=>i.day===d).sort((a,b)=>a.s.localeCompare(b.s));
    return `<div class="day"><h3>${n}</h3>`+(L.map(i=>{
      const s=stu(i.stu)||{name:'?',color:'#888'};
      const cls=c.bad.has(i.id)?'bad':c.warn.has(i.id)?'warn':'';
      return `<div class="item ${cls}" style="--c:${s.color}" data-id="${i.id}"><b>${i.s}-${i.e} ${esc(i.name)}</b><small>${esc(s.name)} · ${i.type}${i.fee?' · '+money(i.fee)+'/月':''}${i.note?'<br>'+esc(i.note):''}</small></div>`;
    }).join('')||'<div class="ok" style="text-align:center">—</div>')+'</div>';
  }).join('');
  // fees
  let h='<table><tr><th>学生</th><th class="n">补习</th><th class="n">活动</th><th class="n">合计</th></tr>',T=[0,0];
  db.students.filter(s=>sel==='all'||s.id===sel).forEach(s=>{
    const a=sum(s.id,'补习'),b=sum(s.id,'活动');T[0]+=a;T[1]+=b;
    h+=`<tr><td><span class="dot" style="--c:${s.color}"></span>${esc(s.name)}</td><td class="n">${money(a)}</td><td class="n">${money(b)}</td><td class="n">${money(a+b)}</td></tr>`;
  });
  h+=`<tr class="tot"><td>总计</td><td class="n">${money(T[0])}</td><td class="n">${money(T[1])}</td><td class="n">${money(T[0]+T[1])}</td></tr></table>`;
  const paid=new Map();
  vis.filter(i=>i.fee>0).forEach(i=>{const k=i.stu+'|'+i.type+'|'+i.name;const o=paid.get(k)||{i,fee:0};o.fee=Math.max(o.fee,i.fee);paid.set(k,o)});
  if(paid.size){h+='<div class="legend">明细（同一科目一周多节只计一次费用）：</div><table>'+[...paid.values()].sort((a,b)=>b.fee-a.fee).map(o=>`<tr><td>${esc((stu(o.i.stu)||{}).name)}</td><td>${o.i.type}：${esc(o.i.name)}</td><td class="n">${money(o.fee)}</td></tr>`).join('')+'</table>'}
  $('fees').innerHTML=h;
}
// fee: same student+type+name counted once (a subject may meet several days; fee is monthly per subject)
function sum(sid,type){
  const m=new Map();
  db.items.filter(i=>i.stu===sid&&i.type===type&&i.fee>0).forEach(i=>m.set(i.name,Math.max(m.get(i.name)||0,i.fee)));
  let t=0;m.forEach(v=>t+=v);return t;
}

function openItem(id){
  if(!db.students.length){alert('请先在「学生」里添加学生');return}
  const it=db.items.find(i=>i.id===id)||{stu:sel!=='all'?sel:db.students[0].id,type:'补习',name:'',day:0,s:'16:00',e:'17:00',fee:'',note:''};
  $('dlgBody').innerHTML=`<h2>${id?'编辑':'添加'}安排</h2>
  <label>学生</label><select id="f_stu">${db.students.map(s=>`<option value="${s.id}" ${s.id===it.stu?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
  <label>类型</label><select id="f_type">${['补习','活动'].map(t=>`<option ${t===it.type?'selected':''}>${t}</option>`).join('')}</select>
  <label>科目 / 活动名称</label><input id="f_name" value="${esc(it.name)}" placeholder="如：数学、钢琴">
  <label>星期</label><select id="f_day">${DAYS.map((d,i)=>`<option value="${i}" ${i===it.day?'selected':''}>${d}</option>`).join('')}</select>
  <label>开始 / 结束时间</label><div class="row"><input type="time" id="f_s" value="${it.s}" style="width:48%"><input type="time" id="f_e" value="${it.e}" style="width:48%"></div>
  <label>每月费用（元，同一科目多天上课只填一次即可，其余留空）</label><input type="number" min="0" id="f_fee" value="${it.fee}">
  <label>备注（老师/地点）</label><input id="f_note" value="${esc(it.note)}">
  <div class="row" style="margin-top:14px;justify-content:space-between"><div>${id?'<button id="f_del">删除</button>':''}</div><div class="row"><button id="f_cancel">取消</button><button class="pri" id="f_ok">保存</button></div></div>`;
  $('dlg').showModal();
  $('f_cancel').onclick=()=>$('dlg').close();
  if(id)$('f_del').onclick=()=>{if(confirm('确定删除？')){db.items=db.items.filter(i=>i.id!==id);save();render();$('dlg').close()}};
  $('f_ok').onclick=()=>{
    const o={id:id||uid(),stu:$('f_stu').value,type:$('f_type').value,name:$('f_name').value.trim(),day:+$('f_day').value,s:$('f_s').value,e:$('f_e').value,fee:Math.max(0,+$('f_fee').value||0),note:$('f_note').value.trim()};
    if(!o.name)return alert('请填写名称');
    if(!o.s||!o.e||o.e<=o.s)return alert('结束时间必须晚于开始时间');
    db.items=id?db.items.map(i=>i.id===id?o:i):[...db.items,o];
    save();render();$('dlg').close();
  };
}

function openStu(){
  const draw=()=>{
    $('dlgBody').innerHTML=`<h2>学生管理</h2>`+(db.students.map(s=>`<div class="row" style="justify-content:space-between;margin:6px 0"><span><span class="dot" style="--c:${s.color}"></span>${esc(s.name)}</span><span class="row"><button data-ren="${s.id}">改名</button><button data-del="${s.id}">删除</button></span></div>`).join('')||'<div class="ok">还没有学生</div>')+
    `<div class="row" style="margin-top:12px"><input id="newStu" placeholder="新学生姓名" style="flex:1"><button class="pri" id="addStu">添加</button></div><div class="row" style="margin-top:12px;justify-content:flex-end"><button id="stuClose">完成</button></div>`;
    $('stuClose').onclick=()=>{$('dlg').close();render()};
    $('addStu').onclick=()=>{const n=$('newStu').value.trim();if(!n)return;db.students.push({id:uid(),name:n,color:COLORS[db.students.length%COLORS.length]});save();draw()};
    $('dlgBody').querySelectorAll('[data-ren]').forEach(b=>b.onclick=()=>{const s=stu(b.dataset.ren),n=prompt('新名字',s.name);if(n&&n.trim()){s.name=n.trim();save();draw()}});
    $('dlgBody').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const s=stu(b.dataset.del);if(confirm(`删除「${s.name}」及其所有安排？`)){db.students=db.students.filter(x=>x.id!==s.id);db.items=db.items.filter(i=>i.stu!==s.id);if(sel===s.id)sel='all';save();draw()}});
  };
  draw();$('dlg').showModal();
}

$('addBtn').onclick=()=>openItem();
$('stuBtn').onclick=openStu;
$('filter').onclick=e=>{const b=e.target.closest('[data-s]');if(b){sel=b.dataset.s;render()}};
$('week').onclick=e=>{const b=e.target.closest('[data-id]');if(b)openItem(b.dataset.id)};
$('expBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='教育管家备份.json';a.click()};
$('impBtn').onclick=()=>$('impFile').click();
$('impFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.students)||!Array.isArray(d.items))throw 0;if(confirm('将覆盖当前数据，继续？')){db=d;sel='all';save();render()}}catch(x){alert('备份文件格式不正确')}};r.readAsText(f);e.target.value=''};

load();render();
if(!db.students.length)openStu();
</script>
</body>
</html>
