<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>APLUS ACHIEVER｜家庭教育管理平台</title>
<style>
:root{--bg:#f5f8f6;--card:#fff;--text:#18322a;--muted:#708078;--line:#e3ebe7;--green:#2d8a62;--green2:#eaf6f0;--red:#c94b4b;--orange:#b87828}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;position:sticky;top:0;z-index:5}.head{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:12px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800;font-size:11px;text-align:center;line-height:1.1}.brand b{font-size:18px}.brand small{display:block;color:var(--muted);font-size:12px}
main{max-width:1180px;margin:auto;padding:22px 18px 50px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.top h1{margin:0;font-size:25px}.top p{margin:4px 0 0;color:var(--muted)}button{border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 13px;border-radius:9px;cursor:pointer;font:inherit}button.primary{background:var(--green);border-color:var(--green);color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:25px;margin-top:3px}
.layout{display:grid;grid-template-columns:1.45fr .85fr;gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}.card h2{font-size:16px;margin:0 0 12px}.section-head{display:flex;justify-content:space-between;align-items:center}
.schedule{display:grid;grid-template-columns:repeat(7,minmax(105px,1fr));gap:7px;overflow:auto}.day{min-height:170px;background:#fafcfb;border:1px solid var(--line);border-radius:10px;padding:8px}.day h3{text-align:center;font-size:12px;color:var(--muted);margin:0 0 7px}.event{padding:8px;margin:5px 0;border-radius:8px;background:var(--green2);border-left:4px solid var(--green);cursor:pointer}.event b{display:block;font-size:13px}.event small{color:var(--muted)}.event.conflict{background:#fff0f0;border-left-color:var(--red)}
.row{display:flex;align-items:center;gap:8px}.student{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.student:last-child{border-bottom:0}.avatar{width:34px;height:34px;border-radius:50%;background:var(--green2);display:grid;place-items:center;color:var(--green);font-weight:700}
.alert{padding:10px 11px;border-radius:9px;margin:7px 0;background:#fff6e9;color:var(--orange)}.alert.red{background:#fff0f0;color:var(--red)}
.money{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}.money:last-child{border-bottom:0}.total{font-size:18px;font-weight:700;margin-top:9px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}.quick button{text-align:left;background:#fafcfb}.quick b{display:block}.quick span{color:var(--muted);font-size:12px}
.empty{color:var(--muted);padding:20px;text-align:center}
dialog{border:0;border-radius:14px;width:min(440px,92vw);padding:0;color:var(--text);box-shadow:0 15px 60px #0002}dialog::backdrop{background:#0005}.modal{padding:18px}.modal h2{margin-top:0}label{display:block;color:var(--muted);font-size:12px;margin:10px 0 4px}input,select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font:inherit}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.schedule{grid-template-columns:repeat(7,115px)}}
</style>
</head>
<body>
<header><div class="head"><div class="brand"><div class="logo">APLUS<br>ACHIEVER</div><div><b>家庭教育管理平台</b><small>让家庭课程、日程、接送与费用一目了然</small></div></div><button onclick="openStudent()">＋ 添加学生</button></div></header>
<main>
<div class="top"><div><h1>家庭首页</h1><p id="today"></p></div><button class="primary" onclick="openEvent()">＋ 添加日程</button></div>
<div class="grid">
<div class="stat"><small>学生</small><strong id="studentCount">0</strong></div>
<div class="stat"><small>今天安排</small><strong id="todayCount">0</strong></div>
<div class="stat"><small>待处理冲突</small><strong id="conflictCount">0</strong></div>
<div class="stat"><small>本月费用</small><strong id="feeTotal">S$0</strong></div>
</div>
<div class="layout">
<section>
<div class="card"><div class="section-head"><h2>本周家庭日程</h2><button onclick="openEvent()">添加</button></div><div class="schedule" id="schedule"></div></div>
<div class="card"><div class="section-head"><h2>冲突提醒</h2></div><div id="conflicts"></div></div>
</section>
<aside>
<div class="card"><h2>孩子</h2><div id="students"></div></div>
<div class="card"><h2>本月费用</h2><div id="fees"></div></div>
<div class="card"><h2>常用操作</h2><div class="quick">
<button onclick="openStudent()"><b>孩子档案</b><span>新增或修改孩子</span></button>
<button onclick="openEvent()"><b>课程 / 活动</b><span>安排时间与费用</span></button>
<button onclick="exportData()"><b>备份资料</b><span>保存当前家庭资料</span></button>
<button onclick="clearData()"><b>清空测试资料</b><span>重新开始</span></button>
</div></div>
</aside>
</div>
</main>
<dialog id="dlg"><div class="modal" id="modal"></div></dialog>
<script>
const days=['周一','周二','周三','周四','周五','周六','周日'];
let db=JSON.parse(localStorage.getItem('education-os')||'null')||{students:[],events:[]};
const $=id=>document.getElementById(id), uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const save=()=>localStorage.setItem('education-os',JSON.stringify(db));
const student=id=>db.students.find(x=>x.id===id);
function money(n){return 'S$'+Number(n||0).toLocaleString('en-SG',{minimumFractionDigits:0,maximumFractionDigits:2})}
function conflicts(){let out=[];for(let d=0;d<7;d++){let a=db.events.filter(x=>x.day===d);for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++)if(a[i].s<a[j].e&&a[j].s<a[i].e){out.push({d,a:a[i],b:a[j],same:a[i].student===a[j].student})}}return out}
function render(){
 const now=new Date(), js=(now.getDay()+6)%7;
 $('today').textContent=now.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'})+' · '+days[js];
 $('studentCount').textContent=db.students.length;
 $('todayCount').textContent=db.events.filter(e=>e.day===js).length;
 $('conflictCount').textContent=conflicts().length;
 $('feeTotal').textContent=money(db.events.reduce((s,e)=>s+Number(e.fee||0),0));
 $('students').innerHTML=db.students.length?db.students.map(s=>'<div class="student"><div class="row"><div class="avatar">'+esc(s.name[0])+'</div><div><b>'+esc(s.name)+'</b><small style="display:block;color:var(--muted)">'+esc(s.grade||'未设置年级')+'</small></div></div><button onclick="editStudent(\''+s.id+'\')">修改</button></div>').join(''):'<div class="empty">还没有学生，先添加孩子</div>';
 $('schedule').innerHTML=days.map((d,i)=>'<div class="day"><h3>'+d+'</h3>'+db.events.filter(e=>e.day===i).sort((a,b)=>a.s.localeCompare(b.s)).map(e=>{let s=student(e.student),bad=conflicts().some(c=>c.a.id===e.id||c.b.id===e.id&&c.same);return '<div class="event '+(bad?'conflict':'')+'" onclick="editEvent(\''+e.id+'\')"><b>'+e.s+'–'+e.e+' '+esc(e.name)+'</b><small>'+(s?esc(s.name):'未指定')+' · '+esc(e.type)+(e.fee?' · '+money(e.fee):'')+'</small></div>'}).join('')||'<div class="empty">—</div></div>').join('');
 let cs=conflicts();$('conflicts').innerHTML=cs.length?cs.map(c=>'<div class="alert '+(c.same?'red':'')+'">'+days[c.d]+' '+c.a.s+'–'+c.a.e+'：'+esc(student(c.a.student)?.name||'')+'「'+esc(c.a.name)+'」与'+esc(student(c.b.student)?.name||'')+'「'+esc(c.b.name)+'」时间重叠'+(c.same?'，需要调整':'，接送时请注意')+'</div>').join(''):'<div class="empty">没有发现时间冲突</div>';
 let by={};db.events.forEach(e=>{let k=e.student+'|'+e.type+'|'+e.name;if(e.fee)by[k]=Math.max(by[k]||0,Number(e.fee))});let total=Object.values(by).reduce((a,b)=>a+b,0);
 $('fees').innerHTML=Object.entries(by).length?Object.entries(by).map(([k,v])=>{let [sid,t,n]=k;return '<div class="money"><span>'+esc(student(sid)?.name||'')+' · '+esc(n)+'</span><b>'+money(v)+'</b></div>'}).join('')+'<div class="total">合计 '+money(total)+'</div>':'<div class="empty">暂无费用</div>';
}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function openStudent(id){let s=student(id)||{name:'',grade:''};$('modal').innerHTML='<h2>'+(id?'修改孩子':'添加孩子')+'</h2><label>孩子姓名</label><input id="sn" value="'+esc(s.name)+'"><label>年级</label><input id="sg" value="'+esc(s.grade)+'" placeholder="如：P4 / Secondary 2"><div class="row" style="justify-content:flex-end;margin-top:16px"><button onclick="dlg.close()">取消</button><button class="primary" onclick="saveStudent(\''+(id||'')+'\')">保存</button></div>';$('dlg').showModal()}
function saveStudent(id){let n=$('sn').value.trim();if(!n)return alert('请填写孩子姓名');if(id){let s=student(id);s.name=n;s.grade=$('sg').value.trim()}else db.students.push({id:uid(),name:n,grade:$('sg').value.trim()});save();dlg.close();render()}
function editStudent(id){openStudent(id)}
function openEvent(id){if(!db.students.length){openStudent();return}let e=db.events.find(x=>x.id===id)||{student:db.students[0].id,type:'补习',name:'',day:0,s:'16:00',e:'17:00',fee:''};$('modal').innerHTML='<h2>'+(id?'修改日程':'添加日程')+'</h2><label>孩子</label><select id="es">'+db.students.map(s=>'<option value="'+s.id+'" '+(s.id===e.student?'selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select><label>类型</label><select id="et"><option '+(e.type==='补习'?'selected':'')+'>补习</option><option '+(e.type==='活动'?'selected':'')+'>活动</option><option '+(e.type==='其他'?'selected':'')+'>其他</option></select><label>课程 / 活动</label><input id="en" value="'+esc(e.name)+'" placeholder="如：数学、钢琴、游泳"><label>星期</label><select id="ed">'+days.map((d,i)=>'<option value="'+i+'" '+(i===e.day?'selected':'')+'>'+d+'</option>').join('')+'</select><label>时间</label><div class="row"><input type="time" id="eb" value="'+e.s+'"><input type="time" id="ee" value="'+e.e+'"></div><label>每月费用</label><input type="number" id="ef" value="'+(e.fee||'')+'" placeholder="如 320"><div class="row" style="justify-content:space-between;margin-top:16px"><div>'+(id?'<button onclick="deleteEvent(\''+id+'\')">删除</button>':'')+'</div><div class="row"><button onclick="dlg.close()">取消</button><button class="primary" onclick="saveEvent(\''+(id||'')+'\')">保存</button></div></div>';$('dlg').showModal()}
function editEvent(id){openEvent(id)}
function saveEvent(id){let o={id:id||uid(),student:$('es').value,type:$('et').value,name:$('en').value.trim(),day:+$('ed').value,s:$('eb').value,e:$('ee').value,fee:Number($('ef').value||0)};if(!o.name)return alert('请填写课程或活动');if(!o.s||!o.e||o.e<=o.s)return alert('请检查时间');if(id)db.events=db.events.map(x=>x.id===id?o:x);else db.events.push(o);save();dlg.close();render()}
function deleteEvent(id){if(confirm('确定删除这项日程？')){db.events=db.events.filter(x=>x.id!==id);save();dlg.close();render()}}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='教育管家备份.json';a.click()}
function clearData(){if(confirm('确定清空当前浏览器中的测试资料？')){db={students:[],events:[]};save();render()}}
render();
</script>
</body>
</html>
